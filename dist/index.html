  <style>
    /* Splash / loading screen */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 60%, #f0f4ff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 600ms ease, transform 600ms ease;
    }

    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      animation: splash-logo-in 700ms cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes splash-logo-in {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .splash-name {
      text-align: center;
      animation: splash-text-in 500ms 200ms both ease;
    }

    @keyframes splash-text-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .splash-name h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1e3a8a;
    }

    .splash-name p {
      font-size: 13px;
      color: #2563eb;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 4px;
    }

    .splash-loader {
      display: flex;
      gap: 6px;
      animation: splash-text-in 400ms 500ms both ease;
    }

    .splash-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2563eb;
      animation: dot-bounce 900ms ease-in-out infinite;
    }

    .splash-dot:nth-child(2) { animation-delay: 150ms; }
    .splash-dot:nth-child(3) { animation-delay: 300ms; }

    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }
  </style>

  <!-- ── Splash hide after app ready ── -->
  <script>
    // Hide splash when DOM + fonts ready
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hide');
          setTimeout(() => splash.remove(), 700);
        }
      }, 1200);
    });

    // Keyboard nav for dock items
    document.addEventListener('keydown', (e) => {
      if (e.target.classList.contains('dock-item') && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        e.target.click();
      }
    });
  </script>
